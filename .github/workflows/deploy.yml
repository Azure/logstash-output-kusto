on:
  workflow_dispatch:  
  release:
    types: [released]

name: Deploy and Create Release

jobs:
  build:
    permissions:
      checks: write
      pull-requests: write
      id-token: write 
      packages: write # for pushing GitHub packages
    name: Upload Release Asset
    runs-on: ubuntu-latest
    steps:
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: jruby
          bundler-cache: true
      - name: Checkout code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - name: Run gradle vendor
        run: ./gradlew vendor
      - name: Build gem
        run: jruby -S gem build *.gemspec
      - name: Get release
        id: get_release
        uses: bruceadams/get-release@f589ce0779c7bef1faf175f7488c972eb47dc046 # v1.2.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish gem
        uses: dawidd6/action-publish-gem@c4713bf1595e0686322d6cf6c1a1c0dcaeca55de # v1.2.0
        with:
          api_key: ${{secrets.RUBYGEMS_KEY}}
          github_token: ${{secrets.GITHUB_TOKEN}}
      - name: Set artifact name
        id: set_artifact_name
        run: |
          ARTIFACT_PATH=$(find . -maxdepth 1 -iname '*.gem')
          echo "::set-output name=artifact_name::$ARTIFACT_PATH"
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: ./${{ steps.set_artifact_name.outputs.artifact_name }}
          asset_name: ${{ steps.set_artifact_name.outputs.artifact_name }}
          asset_content_type: application/zip
